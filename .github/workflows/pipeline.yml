name: Update Dataset

on:
  schedule:
    - cron: '0 6 * * *'   # cada día a las 6
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install pandas requests numpy faker

      - name: Ejecutar script
        run: python pipeline.py
